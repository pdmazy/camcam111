name: Build Android APK (API 34)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK for Cafe Bazaar & Myket (API 34)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK (API Level 34)
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          api-levels: 34
          build-tools: 34.0.0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android Scaffolding
        run: npx cap sync android

      - name: Build Android Debug & Release APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug
          ./gradlew assembleRelease --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Photocopy-Scanner-Debug-API34
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Photocopy-Scanner-Release-API34
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: warn
